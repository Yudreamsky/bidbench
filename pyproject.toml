[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bidbench"
version = "0.1.0"
description = "投标图纸工作台：面向 AI agent 的投标图纸数据底座"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
archives = ["py7zr>=0.20", "rarfile>=4.1"]
claude = ["anthropic>=1.13"]
dev = ["pytest>=8", "anthropic>=1.13"]

[project.scripts]
bidbench = "bidbench.cli:main"

[tool.setuptools.packages.find]
include = ["bidbench*"]

[tool.setuptools.package-data]
bidbench = ["spec/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
