<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="bidbench-token" content="">
<title>投标图纸工作台</title>
<style>
/* 布局：顶部信息条 + 主画布 + 右侧详情面板（窄屏时面板落到下方）。本地工具，不加载任何外部资源。 */
:root {
  --bg: #eef1f4; --surface: #ffffff; --band: #f5f7f9; --ink: #18212b; --muted: #5a6573;
  --line: #c9d1da; --edge: #8b97a5; --accent: #1d5fae; --accent-tint: #e3edf9;
  --ok: #2b7a4b; --warn: #a8690f; --warn-tint: #fbf0de; --crit: #bd3326; --crit-tint: #fbe5e2;
  --font-body: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", system-ui, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11161c; --surface: #19212a; --band: #151c24; --ink: #e3e9ef; --muted: #96a2af;
    --line: #314050; --edge: #6d7d8e; --accent: #6ea6ee; --accent-tint: #1c2f47;
    --ok: #5cbf86; --warn: #e2a64b; --warn-tint: #3a2e1a; --crit: #f0776a; --crit-tint: #3d2220;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55; }
[hidden] { display: none !important; }
.app { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.brand { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); }
h1 { margin: 0; font-size: 20px; }
.meta { margin: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag-sim { display: inline-block; padding: 0 8px; border-radius: 4px; background: var(--warn-tint); color: var(--warn); font-weight: 500; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.controls select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.tab { font: inherit; font-weight: 500; color: var(--muted); background: none; border: 0; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--surface); }
button:focus-visible, select:focus-visible, input:focus-visible, .node:focus-visible, .mm:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.node:focus:not(:focus-visible), .mm:focus:not(:focus-visible) { outline: none; }
.work { display: grid; grid-template-columns: minmax(0, 1fr) clamp(340px, 26vw, 560px); gap: 16px; align-items: start; }
@media (max-width: 980px) { .work { grid-template-columns: minmax(0, 1fr); } }
/* 窗口够大时像桌面软件一样铺满：页面本身不滚动，图谱和右栏各自滚动；窗口太窄或太矮时退回整页滚动 */
@media (min-width: 981px) and (min-height: 560px) {
  body { height: 100vh; overflow: hidden; }
  .app { height: 100vh; }
  .launcher { flex: 1; min-height: 0; overflow: auto; }
  .work { flex: 1; min-height: 0; align-items: stretch; }
  .work > div { min-height: 0; display: flex; flex-direction: column; }
  .view { flex: 1; min-height: 0; }
  .canvas { flex: 1; min-height: 0; }
  .panel { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
}
.view { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; display: flex; flex-direction: column; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
.toolbar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.spacer { flex: 1; }
.btn { font: inherit; font-size: 13px; color: var(--ink); background: var(--band); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--edge); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 18px; height: 11px; border-radius: 3px; border: 1.5px solid var(--line); background: var(--surface); }
.sw.s-updated, .sw.s-new { border: 2px solid var(--accent); }
.sw.s-changed, .sw.s-pending_void { border: 2px solid var(--warn); }
.sw.s-conflict { border: 2px solid var(--crit); }
.sw.s-missing { border: 1.5px dashed var(--muted); background: none; }
.ln { width: 22px; height: 0; border-top: 1.5px solid var(--edge); }
.ln.cross { border-top-style: dashed; }
.ln.catalog { border-top-style: dotted; border-top-width: 2px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.c-confirmed { background: var(--ink); } .c-high { background: var(--ok); } .c-mid { background: var(--accent); }
.c-low { background: var(--warn); } .c-conflict { background: var(--crit); }
.canvas { overflow: auto; padding: 8px; }
.canvas svg { display: block; }
.hint { margin: 0; padding: 8px 14px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }
.band { fill: var(--band); stroke: var(--line); }
.band-label { fill: var(--muted); font-size: 12px; letter-spacing: .08em; }
.edge { stroke: var(--edge); stroke-width: 1.25; fill: none; }
.edge.cross { stroke-dasharray: 6 4; }
.edge.catalog { stroke-dasharray: 2 4; stroke-width: 1.6; }
.edge.dangling { stroke: var(--crit); }
.edge.dim { opacity: .12; }
.edge.on { stroke: var(--accent); stroke-width: 2; }
.arrow { fill: var(--edge); } .arrow-crit { fill: var(--crit); } .arrow-on { fill: var(--accent); }
.node { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: transform .16s ease; }
.node:hover, .node:focus-visible { transform: scale(1.12); }
.node .flag { stroke: var(--surface); stroke-width: 1.5; }
.node .lbl { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
.node.st-missing .lbl, .node.st-voided .lbl { fill: var(--muted); }
.node .ghost { fill: var(--band); stroke: var(--edge); stroke-width: 1.2; }
.gtip ul.vers { margin: 4px 0 0; padding: 0; list-style: none; font-variant-numeric: tabular-nums; color: var(--muted); }
.gtip ul.vers li.cur { color: var(--ink); font-weight: 500; }
.f-updated, .f-new { fill: var(--accent); } .f-changed, .f-pending_void { fill: var(--warn); }
.f-conflict { fill: var(--crit); } .f-missing, .f-voided, .f-inner { fill: var(--muted); }
.canvas { position: relative; }
.gtip { position: absolute; z-index: 5; pointer-events: none; max-width: 340px; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, .18); padding: 8px 10px;
  font-size: 12.5px; line-height: 1.5; opacity: 0; transform: translateY(4px); transition: opacity .14s ease, transform .14s ease; }
.gtip.show { opacity: 1; transform: none; }
.gtip .tt { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.gtip .tt b { font-family: var(--font-mono); }
.gtip .file { color: var(--muted); overflow-wrap: anywhere; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; border: 0; background: var(--band); color: var(--muted); padding: 3px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.gcolor { font: inherit; font-size: 13px; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
#net { display: block; width: 100%; height: 100%; min-height: 480px; cursor: grab; touch-action: none; }
.legend .grp { display: inline-flex; align-items: center; gap: 6px; }
.gsearch { font: inherit; font-size: 13px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 170px; }
@media (prefers-reduced-motion: reduce) { .node, .gtip { transition: none; } }
.node .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.25; }
.node.st-updated .box, .node.st-new .box { stroke: var(--accent); stroke-width: 2; }
.node.st-changed .box, .node.st-pending_void .box { stroke: var(--warn); stroke-width: 2; }
.node.st-conflict .box { stroke: var(--crit); stroke-width: 2; }
.node.st-missing .box, .node.st-voided .box { fill: var(--band); stroke: var(--muted); stroke-dasharray: 5 4; }
.node .num { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; fill: var(--ink); }
.node .ttl { font-size: 12px; fill: var(--muted); }
.node.st-missing .num, .node.st-voided .num, .node.st-missing .ttl, .node.st-voided .ttl { fill: var(--muted); }
.node .tag { font-size: 11px; font-weight: 500; }
.t-updated, .t-new { fill: var(--accent); } .t-changed, .t-pending_void { fill: var(--warn); }
.t-conflict, .t-missing { fill: var(--crit); } .t-voided, .t-inner { fill: var(--muted); }
.node .ring { fill: none; stroke: var(--accent); stroke-width: 2.5; opacity: 0; }
.node.sel .ring { opacity: 1; }
.node.hl .box { fill: var(--accent-tint); }
.node.dim { opacity: .28; }
.mm { cursor: pointer; }
.mm-link { fill: none; stroke: var(--line); stroke-width: 1.5; }
.mm .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.25; }
.mm-root .box { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 2; }
.mm-root text { font-weight: 700; fill: var(--ink); font-size: 14px; }
.mm-group text.lbl { font-weight: 600; fill: var(--ink); font-size: 13px; }
.mm-group text.cnt { fill: var(--muted); font-size: 12px; font-family: var(--font-mono); }
.mm-fact text { fill: var(--ink); font-size: 13px; }
.mm-fact.conf-conflict .box { stroke: var(--crit); }
.mm-fact.hl .box { fill: var(--accent-tint); stroke: var(--accent); }
.mm-fact.sel .box { stroke: var(--accent); stroke-width: 2.5; }
.mm-fact.dim { opacity: .35; }
.cd-confirmed { fill: var(--ink); } .cd-high { fill: var(--ok); } .cd-mid { fill: var(--accent); } .cd-low { fill: var(--warn); } .cd-conflict { fill: var(--crit); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel > * { flex-shrink: 0; }  /* 内容比右栏高时整栏滚动，不把带滚动条的运行记录框压扁 */
.panel h2 { margin: 0; font-size: 16px; }
.panel h3 { margin: 0 0 6px; font-size: 12px; font-weight: 500; letter-spacing: .08em; color: var(--muted); }
.panel p { margin: 0; }
.ptitle { display: flex; flex-direction: column; gap: 4px; }
.pnum { font-family: var(--font-mono); font-size: 22px; font-weight: 600; line-height: 1.2; }
.pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill.st-updated, .pill.st-new, .pill.conf-mid { color: var(--accent); border-color: var(--accent); }
.pill.st-changed, .pill.st-pending_void, .pill.conf-low { color: var(--warn); border-color: var(--warn); }
.pill.st-conflict, .pill.st-missing, .pill.conf-conflict { color: var(--crit); border-color: var(--crit); }
.pill.conf-high { color: var(--ok); border-color: var(--ok); }
.pill.conf-confirmed { color: var(--ink); border-color: var(--ink); }
dl.kv { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
.note { padding: 8px 10px; border-radius: 6px; font-size: 13px; background: var(--band); border-left: 3px solid var(--edge); }
.note.warn { background: var(--warn-tint); border-left-color: var(--warn); }
.note.crit { background: var(--crit-tint); border-left-color: var(--crit); }
.note .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; }
.crit-line { display: block; color: var(--crit); font-size: 12px; }
.sgroup + .sgroup { margin-top: 6px; }
.sgroup > .meta { font-size: 12px; }
.panel details > summary { cursor: pointer; color: var(--accent); font-size: 13px; }
ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
ul.list li { min-width: 0; overflow-wrap: anywhere; }
.issue { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; background: var(--band); }
.issue .head { display: flex; gap: 8px; align-items: flex-start; }
.issue .head .dot { margin-top: 6px; }
.issue .go { font: inherit; text-align: left; background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; font-weight: 500; }
.issue .go:hover { color: var(--accent); }
.issue small { color: var(--muted); display: block; font-size: 12px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.linkbtn { font: inherit; text-align: left; width: 100%; display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--band); color: var(--ink); cursor: pointer; }
.linkbtn:hover { border-color: var(--accent); }
.linkbtn .dot { margin-top: 6px; }
.linkbtn small { color: var(--muted); display: block; }
.chip { font: inherit; font-family: var(--font-mono); font-size: 12px; padding: 1px 8px; border-radius: 4px; border: 1px solid var(--accent); color: var(--accent); background: none; cursor: pointer; }
.ev { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
.ev.stale { opacity: .6; }
.ev .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 12px; color: var(--muted); }
.ev q { font-size: 13px; color: var(--ink); quotes: "「" "」"; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; }
.stat b { font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.3; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.crit b { color: var(--crit); } .stat.warn b { color: var(--warn); }
.versions li { display: grid; grid-template-columns: 34px 92px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-variant-numeric: tabular-nums; }
.versions li.old { color: var(--muted); }
.form { display: flex; gap: 6px; }
.form input { font: inherit; flex: 1; min-width: 0; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.update-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 12px; border-radius: 8px;
  background: var(--accent-tint); border: 1px solid var(--accent); font-size: 13px; }
.update-bar b { color: var(--accent); }
.job-bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 6px 12px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
.job-bar .bar { flex: 1 1 160px; max-width: 320px; }
.prio li label { display: flex; gap: 8px; align-items: baseline; cursor: pointer; }
.prio li small { display: block; margin-left: 24px; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.launcher { width: 100%; max-width: 720px; margin: 24px auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { margin: 8px 0 0; font-size: 15px; }
.card h2:first-child { margin-top: 0; }
li.recent { display: flex; gap: 6px; align-items: stretch; }
li.recent .linkbtn { flex: 1; }
.linkbtn[disabled] { opacity: .5; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.field > span { color: var(--muted); }
.field small { color: var(--muted); font-size: 12px; }
.field input, .field select { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; }
.joblog { margin: 0; font-family: var(--font-mono); font-size: 12px; background: var(--band); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-height: 360px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.bar { height: 6px; background: var(--band); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.logrow { border-bottom: 1px solid var(--line); padding: 6px 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.logrow:last-child { border-bottom: 0; }
.logrow .head { display: flex; gap: 8px; align-items: baseline; }
.logrow .head .mono { color: var(--muted); flex: none; width: 40px; }
.logrow > small, .logrow > details { margin-left: 48px; }
.logrow .what { font-weight: 500; min-width: 0; overflow-wrap: anywhere; flex: 1; }
.logrow small { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.logrow .bad { color: var(--crit); }
.logrow summary { cursor: pointer; color: var(--accent); font-size: 12px; }
.logrow .joblog { margin-top: 4px; }
.chat { display: flex; flex-direction: column; gap: 14px; }
.turn { display: flex; flex-direction: column; gap: 6px; }
.turn .q { align-self: flex-end; max-width: 92%; background: var(--accent-tint); border-radius: 8px; padding: 6px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.turn .a { background: var(--band); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-wrap: anywhere; }
.turn .a p { margin: 0 0 6px; }
.turn .a > :last-child { margin-bottom: 0; }
.turn .a ul, .turn .a ol { margin: 0 0 6px; padding-left: 20px; }
.turn .a h4 { margin: 2px 0 4px; font-size: 13px; }
.turn .a code { font-family: var(--font-mono); font-size: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
.turn .steps { font-size: 12px; color: var(--muted); }
.turn .steps summary { cursor: pointer; }
.turn .steps ul.list { font-size: 12px; gap: 2px; margin-top: 4px; }
.turn .steps li.running::after { content: " …"; }
.turn .steps li.failed { color: var(--crit); }
.chat-input textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); resize: vertical; min-height: 64px; }
.chat-input select { font: inherit; font-size: 12px; padding: 2px 4px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 150px; }
.sheetlink { font: inherit; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline dotted; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 2px 10px; cursor: pointer; color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 8px 16px; border-radius: 6px; font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">投标图纸工作台</span>
      <h1 id="proj-name">加载中…</h1>
      <p class="meta" id="proj-meta"></p>
    </div>
    <div class="controls">
      <div class="actions" id="actions"></div>
      <label class="meta" for="as-of">查看截至</label>
      <select id="as-of"></select>
      <nav class="tabs" role="tablist" aria-label="显示模式">
        <button class="tab" role="tab" id="tab-graph" aria-controls="view-graph" aria-selected="true">图纸知识图谱</button>
        <button class="tab" role="tab" id="tab-facts" aria-controls="view-facts" aria-selected="false">事实思维导图</button>
      </nav>
    </div>
  </header>
  <div class="update-bar" id="update-bar" hidden></div>
  <div class="job-bar" id="job-bar" role="status" hidden></div>
  <div class="launcher" id="launcher" hidden></div>
  <div class="work" id="work">
    <div>
      <section class="view" id="view-graph" role="tabpanel" aria-labelledby="tab-graph">
        <div class="toolbar">
          <span class="seg" role="group" aria-label="图谱样式">

<script>
(() => {
const NS = 'http://www.w3.org/2000/svg';

const STATUS = { current: '现行', new: '本批新增', updated: '本批升版', changed: '有变更单', conflict: '冲突',
  pending_void: '作废还是漏发', voided: '已作废', missing: '缺失' };
const CONF = { confirmed: '人工确认', high: '高置信', mid: '中置信', low: '低置信', conflict: '冲突' };
const DISC_ORDER = ['建筑', '结构', '给排水', '暖通', '电气', '其他'];

let S = null, APP = null;
const TOKEN = document.querySelector('meta[name="bidbench-token"]').content;
const ui = { view: 'graph', selD: null, selF: null, focusSet: null, backTo: null, collapsed: new Set(),
  graphIssues: false, factIssues: false, asOf: null,
  job: null, jobView: false, jobFirst: null };  // 后台任务：最新状态、右栏是否在看它的进度、进度面板的第一个元素
let nodeEls = {}, edgeEls = [], sheetBy = {}, factBy = {}, factGroupOf = {};

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null) continue;

}

}
const ctx = document.createElement('canvas').getContext('2d');

}
function toast(msg) {

  document.body.append(t);
  setTimeout(() => t.remove(), 2200);
}

async function load(asOf) {
  const r = await fetch('/api/state' + (asOf ? `?as_of=${asOf}` : ''));
  if (r.status === 409) { await refreshApp(); showLauncher(); return; }
  setState(await r.json());
}
async function api(url, body) {
  // 改动类请求都带上本页面的令牌，本机服务据此确认请求来自工作台本身
  let r, data;
  try {
    r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Bidbench-Token': TOKEN }, body: JSON.stringify(body) });
    data = await r.json();
  } catch (e) { toast('连接本地服务失败'); return { ok: false, data: {} }; }
  if (!r.ok) toast(data.error || '操作失败');
  return { ok: r.ok, data };

async function post(url, body) {

}
async function actProposal(id, action) {
  const r = await api('/api/proposal', { id, action });
  if (!r.ok) return;
  const data = r.data;
  setState(data);
  toast(data.last_outcome || (action === 'confirm' ? '已确认' : '已驳回'));
}
function proposalSummary(p) {
  const d = p.payload;
  if (p.kind === 'decision') return `${d.issue_title} → ${d.label}`;
  if (p.kind === 'baseline') return `锁定基线「${d.name}」（${d.sheets ? d.sheets.join('、') : '全部现行图纸'}）`;
  if (p.kind === 'note') return `项目笔记「${d.topic}」：${d.text}`;
  if (p.kind === 'improvement') return `改进建议「${d.title}」：${d.suggestion}`;
  return p.kind;
}
async function decide(opt) {
  if (await post('/api/decision', { kind: opt.kind, key: opt.key, value: opt.value })) toast('已记录：' + opt.label);
}

function setState(st, keepPanel) {
  S = st;
  sheetBy = Object.fromEntries(S.sheets.map(s => [s.no, s]));
  factBy = {}; factGroupOf = {};
  S.facts.groups.forEach(g => g.facts.forEach(f => { factBy[f.key] = f; factGroupOf[f.key] = g.label; }));
  if (ui.selD && !sheetBy[ui.selD]) ui.selD = null;
  if (ui.selF && !factBy[ui.selF]) ui.selF = null;
  renderHeader();
  buildGraph();
  renderMind();
  if (keepPanel) return;  // AI 助手面板里更新数据时留在面板上
  if (ui.selD) renderSheet(ui.selD); else if (ui.selF) renderFact(ui.selF); else renderOverview();
}

function renderHeader() {
  document.getElementById('proj-name').textContent = S.project.name;
  const b = S.batches.find(x => x.seq === S.as_of);
  const rec = S.recognition;
  const ex = Object.entries(rec.executors).map(([k, v]) => `${({ simulated: '模拟执行器', claude: 'Claude', codex: 'Codex' })[k] || k} ${v} 页`).join('、') || '尚未识别';
  const meta = document.getElementById('proj-meta');
  meta.replaceChildren(`${S.batches.length} 个收图批次 · ${S.sheets.length} 个图号 · `,
    b ? `截至 ${b.received_at} · ` : '', `已识别 ${rec.recognized}/${rec.pages} 页（${ex}）`,
    rec.executors.simulated ? el('span', {}, ' · ', el('span', { class: 'tag-sim' }, '识别结果为模拟数据')) : '',
    VER ? el('span', {}, ' · ', el('button', { class: 'chip', type: 'button', onclick: renderUpdate, title: '软件更新' },
      `v${VER.version}${VER.build ? ' b' + VER.build : VER.commit ? ' ' + VER.commit : ''}`)) : '');
  const sel = document.getElementById('as-of');
  sel.hidden = !S.batches.length;
  sel.previousElementSibling.hidden = !S.batches.length;
  sel.replaceChildren(...S.batches.map(x => el('option', { value: x.seq }, `批次 #${x.seq}（${x.received_at}）`)));
  sel.value = S.as_of;
}

/* ---------- 图谱 ---------- */
const gsvg = document.getElementById('graph');
let laidOutAt = 0;  // 上次排版时图谱区的宽度
let ALIAS = {}, nodeBox = {}, edgeLayer = null, hoverNo = null;
function graphWidth() {
  const w = gsvg.parentElement.clientWidth - 16;  // 去掉内边距；图谱区隐藏时为 0
  return w > 0 ? Math.max(700, w) : 1040;
}
/* 图谱上的短名：按“词 + 楼层”压缩到三个字以内（一串数字算一个字），例如 平面12、梁12、通风B2、剖面1-1、目录 */
const CN_D = { 〇: 0, 零: 0, 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
function cnInt(t) {

  const m = t.match(/^([一二两三四五六七八九])?十([一二三四五六七八九])?$/);
  if (m) return (m[1] ? CN_D[m[1]] : 1) * 10 + (m[2] ? CN_D[m[2]] : 0);
  return t.length === 1 && t in CN_D ? CN_D[t] : null;
}
const NUM = '[\\d一二两三四五六七八九十]+';
function floorTag(t) {
  let m;
  if ((m = t.match(new RegExp(`(?:地下|负)\\s*(${NUM})\\s*层`))) && cnInt(m[1])) return 'B' + cnInt(m[1]);
  if ((m = t.match(/(?:^|[^A-Za-z])B(\d+)(?:F|层)?/))) return 'B' + +m[1];
  if ((m = t.match(new RegExp(`(${NUM})\\s*[~～\\-—至到]\\s*(${NUM})\\s*层`))) && cnInt(m[1]) && cnInt(m[2])) return `${cnInt(m[1])}~${cnInt(m[2])}`;
  if ((m = t.match(/(\d+)\s*F\s*[~～\-—]\s*(\d+)\s*F/i))) return `${+m[1]}~${+m[2]}`;
  if (/首层/.test(t)) return '1';
  if ((m = t.match(new RegExp(`(${NUM})\\s*层`))) && cnInt(m[1])) return String(cnInt(m[1]));
  if ((m = t.match(/(\d+)\s*F(?![a-z])/i))) return String(+m[1]);
  return null;
}
const FLOOR_WORDS = [[/梁/, '梁'], [/板/, '板'], [/墙柱|柱/, '墙柱'], [/剪力墙|墙/, '墙'], [/给排水|给水|排水/, '给排'],
  [/通风|排烟/, '通风'], [/空调/, '空调'], [/照明/, '照明'], [/动力/, '动力'], [/消防|喷淋|消火栓/, '消防'], [/弱电|智能/, '弱电'],
  [/防雷|接地/, '防雷'], [/平面|布置/, '平面']];
const SHEET_WORDS = [[/目录/, '目录'], [/总说明|设计说明|施工说明|说明/, '说明'], [/门窗表/, '门窗表'], [/门窗/, '门窗'],
  [/立面.*剖面|剖面.*立面/, '立剖'], [/[东南西北]立面/, t => t.match(/([东南西北])立面/)[1] + '立面'], [/立面/, '立面'], [/剖面/, '剖面'],
  [/卫生间/, '卫生间'], [/电梯/, '电梯'], [/楼梯/, '楼梯'], [/核心筒/, '核心筒'], [/女儿墙/, '女儿墙'], [/墙身/, '墙身'],
  [/幕墙/, '幕墙'], [/屋面.*(?:节点|详图)/, '屋面节'], [/梁柱节点/, '梁柱节'], [/节点/, '节点'], [/基础/, '基础'], [/桩/, '桩基'],
  [/柱平面|柱布置|柱定位/, '柱平面'], [/墙柱/, '墙柱'], [/剪力墙/, '剪力墙'], [/梁配筋/, '梁配筋'], [/板配筋/, '板配筋'],
  [/柱/, '柱'], [/梁/, '梁'], [/板/, '板'], [/系统/, '系统'], [/人防/, '人防'], [/总图|总平面/, '总图'],
  [/照明/, '照明'], [/动力/, '动力'], [/通风|排烟/, '通风'], [/空调/, '空调'], [/给排水|给水|排水/, '给排'], [/消防|喷淋/, '消防'],
  [/弱电|智能/, '弱电'], [/详图|大样/, '详图'], [/表/, '表'], [/平面|布置/, '平面']];
const SHORTER = { 核心筒: '核心', 卫生间: '卫生', 女儿墙: '女儿', 门窗表: '门窗', 剪力墙: '剪墙', 屋面节: '屋面', 梁柱节: '节点' };
const units = t => (t.match(/[\u4e00-\u9fff]/g) || []).length + (t.match(/[0-9A-Za-z~\-]+/g) || []).length;
function shortName(s) {
  const t = (s.title || '').replace(/\s+/g, '');
  if (!t) return ((s.discipline || '其')[0]) + ((s.no.match(/(\d+)\D*$/) || [, ''])[1]);  // 没有图名：专业加编号，如 建10
  let m = t.match(/([0-9A-Z]{1,2})[-—]\1剖面/);
  if (m) return `剖面${m[1]}-${m[1]}`;
  const fl = floorTag(t), roof = /屋顶|屋面|机房层/.test(t), std = /标准层/.test(t);
  const fw = FLOOR_WORDS.find(([re]) => re.test(t));
  if (fw && (fl || roof || std) && !/详图|大样|节点|系统/.test(t)) {  // 分楼层的平面、配筋图：词 + 楼层
    const w = fw[1];
    if (fl) return w + fl;
    if (roof) return w === '平面' ? '屋顶' : units('屋面' + w) <= 3 ? '屋面' + w : '屋' + w;
    return w === '平面' ? '标准层' : '标' + w;
  }
  const hit = SHEET_WORDS.find(([re]) => re.test(t));
  if (hit) {  // 不分楼层的图：关键词，带编号的加编号（墙身12、楼梯3）
    let w = typeof hit[1] === 'function' ? hit[1](t) : hit[1];
    m = t.match(/(\d+|[一二三四五六七八九十]+)$/);
    const n = fl || (m ? String(cnInt(m[1]) ?? m[1]) : null);
    if (n) {
      if (units(w) >= 3) w = SHORTER[w] || w.slice(0, 2);
      return w + n;
    }
    return w;
  }
  if (fl) return '层' + fl;
  return t.replace(/^(建筑|结构|给排水|暖通|电气)/, '').replace(/图$/, '').slice(0, 3);
}
const DETAIL_SHORT = { 墙柱: '柱', 墙身: '墙', 楼梯: '梯', 节点: '节', 核心: '核', 卫生: '卫', 剪墙: '墙' };
function altName(s, name) {  // 详图和同名的分层图撞名时换个写法：墙柱3 → 柱详3
  const m = name.match(/^([一-鿿]+)(.+)$/);
  return m && /详图|大样/.test(s.title || '') ? (DETAIL_SHORT[m[1]] || m[1][0]) + '详' + m[2] : null;
}
function shortNames() {
  const out = {}, used = new Set();
  S.sheets.forEach(s => {
    const key = x => s.discipline + '|' + x;
    let n = shortName(s);
    if (used.has(key(n))) { const a = altName(s, n); if (a && !used.has(key(a))) n = a; }
    let name = n, k = 1;
    while (used.has(key(name))) name = `${n}·${++k}`;  // 还撞名就加序号
    used.add(key(name));
    out[s.no] = name;
  });
  return out;
}
function series(no) {  // 图号的百位段：建施-101~199 是一段，建施-201~ 另起一段
  const m = no.match(/(\d+)\D*$/);
  return m && m[1].length >= 3 ? m[1].slice(0, -2) : '';
}
function layout() {
  laidOutAt = graphWidth();
  ALIAS = shortNames();
  const groups = {};
  S.sheets.forEach(s => (groups[s.discipline] ||= []).push(s));
  const discs = Object.keys(groups).sort((a, b) => DISC_ORDER.indexOf(a) - DISC_ORDER.indexOf(b));
  const MAXW = laidOutAt, GAPX = 16, GAPY = 16, PAD = 12, GAP = 8, ROWH = NH + GAP, HEAD = 34;
  let x = 12, y = 12, rowH = 0, maxX = 0;
  const bands = [], pos = {};
  discs.forEach(d => {
    const items = groups[d];
    const cw = Math.max(60, ...items.map(s => Math.ceil(textW(ALIAS[s.no], 12.5, 600)) + 22));  // 同一专业的方块一样宽，排得整齐
    const fit = Math.max(1, Math.floor((MAXW - 24 - PAD * 2 + GAP) / (cw + GAP)));
    const cols = Math.min(fit, Math.max(1, Math.ceil(Math.sqrt(items.length * 2.2))));  // 少时接近方形，多时铺满一行
    const rows = [];
    let row = [], ser = null;
    items.forEach(s => {
      const k = series(s.no);
      if (row.length && (row.length >= cols || k !== ser)) { rows.push(row); row = []; }
      row.push(s); ser = k;
    });
    if (row.length) rows.push(row);
    const bw = Math.max(...rows.map(r => r.length)) * (cw + GAP) - GAP + PAD * 2;
    const bh = HEAD + rows.length * ROWH - GAP + PAD;
    if (x + bw > MAXW && x > 12) { x = 12; y += rowH + GAPY; rowH = 0; }
    bands.push({ d, x, y, w: Math.max(bw, 120), h: bh, n: items.length });
    rows.forEach((r, ri) => r.forEach((s, ci) => { pos[s.no] = { x: x + PAD + ci * (cw + GAP), y: y + HEAD + ri * ROWH, w: cw, h: NH }; }));
    x += Math.max(bw, 120) + GAPX; rowH = Math.max(rowH, bh); maxX = Math.max(maxX, x);
  });
  return { bands, pos, w: Math.max(maxX, 400), h: y + rowH + 12 };
}
function clip(cx, cy, tx, ty, w, h) {
  const dx = tx - cx, dy = ty - cy;
  const s = Math.min((w / 2 + 4) / Math.abs(dx || 1e-6), (h / 2 + 4) / Math.abs(dy || 1e-6));
  return [cx + dx * s, cy + dy * s];
}
const bigGraph = () => S.sheets.length > EDGE_ALL_MAX;
function drawEdges() {
  // 图少画全部连线；图多只画选中、鼠标指着的那张图的连线，不然会缠成一团
  edgeLayer.textContent = ''; edgeEls = [];
  const keys = new Set([ui.selD, hoverNo].filter(Boolean));
  const seen = new Set();
  S.edges.forEach(e => {
    if (bigGraph() && !keys.has(e.from) && !keys.has(e.to)) return;
    const A = nodeBox[e.from], B = nodeBox[e.to];
    const k = `${e.from}>${e.to}`;
    if (!A || !B || seen.has(k)) return;
    seen.add(k);
    const ac = [A.x + A.w / 2, A.y + A.h / 2], bc = [B.x + B.w / 2, B.y + B.h / 2];
    const p1 = clip(...ac, ...bc, A.w, A.h), p2 = clip(...bc, ...ac, B.w, B.h);
    const dangling = sheetBy[e.to] && ['missing', 'voided'].includes(sheetBy[e.to].status);
    const line = sv('line', { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], class: `edge ${e.type}${dangling ? ' dangling' : ''}` });
    if (e.type !== 'cross') line.setAttribute('marker-end', `url(#${dangling ? 'g-arrow-crit' : 'g-arrow'})`);
    line.append(sv('title', {}, `${e.from} → ${e.to}：${e.label}`));
    edgeLayer.append(line);
    edgeEls.push({ ...e, dangling, line });
  });
}
const gtip = el('div', { class: 'gtip', role: 'tooltip' });
gsvg.parentElement.append(gtip);
function showTip(s, r) {  // r：图纸在屏幕上的位置（getBoundingClientRect 那样的 left/top/right/bottom）
  // 鼠标指着的图：源文件名和简单说明
  const src = (s.paths || [])[0];
  gtip.replaceChildren(
    el('div', { class: 'tt' }, el('b', {}, s.no), el('span', { class: `pill st-${s.status}` }, STATUS[s.status])),
    el('div', {}, (s.title || '（图名未知）') + (s.current_rev ? `，${s.current_rev} 版` : '')),
    el('div', { class: 'file' }, src ? `源文件：${src.split(' / ').pop()}` : (s.notes || []).join('；') || '没有收到'),

let UPD = null, VER = null;
async function checkUpdate(force) {
  try {
    VER = await (await fetch('/api/version')).json();
    if (S) renderHeader();  // 项目数据还没加载完时，等 setState 时再画页头
    UPD = await (await fetch('/api/update/check' + (force ? '?force=1' : ''))).json();
  } catch (e) { return; }
  const bar = document.getElementById('update-bar');
  if (UPD.status === 'available') {
    bar.replaceChildren(el('b', {}, '有新版本'), `${UPD.commits.length} 项更新`,
      el('button', { class: 'btn primary', type: 'button', onclick: renderUpdate }, '查看并更新'));
    bar.hidden = false;
  } else bar.hidden = true;
}
function renderUpdate() {
  const u = UPD || {};
  if (workEl.hidden) { launcherEl.hidden = true; workEl.hidden = false; }  // 项目选择界面上也能看更新
  const parts = [el('button', { class: 'btn', type: 'button', onclick: () => (S ? clearAll() : showLauncher()) }, S ? '← 问题中心' : '← 选择项目'),
    el('div', { class: 'ptitle' }, el('h2', {}, '软件更新'),
      el('p', { class: 'meta' }, `当前 ${VER ? VER.version + '（' + (VER.build ? '构建 b' + VER.build : VER.commit || '未知') + '）' : ''}`))];
  if (u.status === 'available') {
    parts.push(section(`本次更新（${u.commits.length}）`, el('ul', { class: 'list' }, u.commits.map(c =>
      el('li', {}, el('span', { class: 'mono' }, c.date), ' ', c.title)))));
    if (u.deps_changed) parts.push(el('div', { class: 'note warn' }, '这次更新改动了依赖，重启前会自动补装，可能多花一两分钟。'));
    parts.push(el('div', { class: 'note' }, VER && VER.mode === 'installer'
      ? '会下载新的安装包，校验后自动安装，窗口关闭后自动重新打开。不会动你的项目数据和设置。'
      : '更新只替换程序代码，不会动你的项目数据；更新后可以回退到上一版。'));
    parts.push(el('div', { class: 'opts' }, el('button', { class: 'btn primary', type: 'button', onclick: () => runUpdate('apply') }, '更新并重启')));
  } else {
    parts.push(el('div', { class: `note ${u.status === 'up_to_date' ? '' : 'warn'}` }, u.message || '无法检查更新。'));
    parts.push(el('div', { class: 'opts' }, el('button', { class: 'btn', type: 'button', onclick: async () => { await checkUpdate(true); renderUpdate(); } }, '重新检查')));
  }
  if (VER && VER.mode === 'installer' && u.previous) parts.push(section('回退', el('p', { class: 'meta' }, `新版本有问题时，可以重新安装上一个版本 ${u.previous}。项目数据不受影响。`),
    el('div', { class: 'opts', style: 'margin-top:6px' }, el('button', { class: 'btn', type: 'button', onclick: () => runUpdate('rollback') }, `回退到 ${u.previous}`))));
  else if (VER && VER.can_rollback && VER.last_update) parts.push(section('回退', el('p', { class: 'meta' }, `上次更新于 ${VER.last_update.replace('T', ' ')}。新版本有问题时可以回到更新前的版本。`),
    el('div', { class: 'opts', style: 'margin-top:6px' }, el('button', { class: 'btn', type: 'button', onclick: () => runUpdate('rollback') }, '回退到上一版'))));
  panel.replaceChildren(...parts);
}
async function runUpdate(action) {
  if (VER && VER.mode === 'installer') { startJob(action === 'apply' ? 'update' : 'rollback', {}); return; }
  panel.replaceChildren(el('div', { class: 'ptitle' }, el('h2', {}, action === 'apply' ? '正在更新' : '正在回退'),
    el('p', { class: 'meta' }, '正在拉取代码并重启工作台，完成后页面会自动刷新。请不要关闭命令行窗口。')));
  const r = await api(`/api/update/${action}`, {});
  if (!r.ok) { renderUpdate(); return; }
  const before = VER && VER.commit;
  const started = Date.now();
  const poll = async () => {
    try {
      const v = await (await fetch('/api/version', { cache: 'no-store' })).json();
      if (v.commit && v.commit !== before) { location.reload(); return; }
    } catch (e) { /* 重启中，继续等 */ }
    if (Date.now() - started > 120000) {
      panel.replaceChildren(el('div', { class: 'note warn' }, '重启时间比预期长。请稍后手动刷新页面；如果打不开，在命令行重新运行 bidbench serve。'));
      return;
    }
    setTimeout(poll, 1500);
  };
  setTimeout(poll, 2000);
}

/* AI 助手：用 Codex 回答这个项目的问题；处理问题、确认事实只生成提议，你确认后才生效 */
let CHAT = null, chatTimer = null, chatDraft = '', chatPainted = '';
const EXAMPLES = ['这批图有什么变化？', '还缺哪些图？', '地上层数到底是多少？', '帮我起草答疑问题清单'];
const reEscape = x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function mdInline(s) {
  // **粗体**、`代码`，以及项目里的图号（点一下跳到图谱上那张图）
  const nos = S ? Object.keys(sheetBy).sort((a, b) => b.length - a.length) : [];
  const pat = new RegExp('(\\*\\*[^*]+\\*\\*|`[^`]+`' + (nos.length ? '|' + nos.map(reEscape).join('|') : '') + ')', 'g');
  const out = [];
  let last = 0, m;
  while ((m = pat.exec(s))) {
    if (m.index > last) out.push(s.slice(last, m.index));
    const t = m[0];
    if (t.startsWith('**')) out.push(el('b', {}, t.slice(2, -2)));
    else if (t.startsWith('`')) out.push(el('code', {}, t.slice(1, -1)));
    else out.push(el('button', { class: 'sheetlink', type: 'button', title: '在图谱上查看这张图', onclick: () => jumpSheet(t) }, t));
    last = m.index + t.length;
  }
  if (last < s.length) out.push(s.slice(last));
  return out;
}
function mdBlock(text) {
  // 只认段落、列表、小标题、粗体和代码；一律生成 DOM 节点，不把回答当 HTML
  const box = el('div', { class: 'a' });
  let list = null, para = null;
  for (const raw of String(text || '').replace(/\r/g, '').split('\n')) {
    const line = raw.trimEnd();
    if (!line.trim()) { list = null; para = null; continue; }
    if (/^#{1,6}\s/.test(line)) { list = null; para = null; box.append(el('h4', {}, mdInline(line.replace(/^#+\s*/, '')))); continue; }
    const li = line.match(/^\s*(?:[-*•]|\d+[.)、])\s+(.*)$/);
    if (li) {
      const tag = /^\s*\d/.test(line) ? 'OL' : 'UL';
      if (!list || list.tagName !== tag) { list = el(tag.toLowerCase(), {}); box.append(list); para = null; }
      list.append(el('li', {}, mdInline(li[1])));
      continue;
    }
    list = null;
    if (!para) { para = el('p', {}); box.append(para); } else para.append(el('br'));
    para.append(...mdInline(line));
  }
  return box;
}

function renderTurn(t) {

  const running = t.status === 'running';
  const steps = t.steps.length ? el('details', { class: 'steps', open: running ? '' : null },
    el('summary', {}, running ? `正在查……（已查 ${tools.length} 次）` : `查了 ${tools.length} 次`),
    el('ul', { class: 'list' }, t.steps.map(x => el('li', { class: x.state }, x.kind === 'tool' ? `查询：${x.text}` : x.text))))
    : running ? el('p', { class: 'meta' }, '正在思考……') : null;
  const body = t.status === 'done' ? mdBlock(t.answer) : running ? null
    : el('div', { class: `note${t.status === 'stopped' ? '' : ' crit'}` }, t.error || '没有回答');
  const props = (t.proposals || []).map(x => el('div', { class: 'issue' },
    el('div', { class: 'head' }, el('i', { class: 'dot c-mid' }),

function paintChat() {
  const box = document.getElementById('chat-log');

  const send = document.getElementById('chat-send'), stop = document.getElementById('chat-stop');

/* 操作日志：收图、识别、导出、人工决定、AI 助手提议，按天分组，最新的在最上面 */
const pad2 = n => String(n).padStart(2, '0');
const dayOf = t => `${t.getFullYear()}-${pad2(t.getMonth() + 1)}-${pad2(t.getDate())}`;
const secsText = s => s < 60 ? `${Math.round(s)} 秒` : `${Math.floor(s / 60)} 分 ${Math.round(s % 60)} 秒`;
async function renderLog() {
  let data;

    const r = await fetch('/api/log?limit=300');
    data = await r.json();
    if (!r.ok) throw new Error(data.error);
  } catch (e) { toast('读不到操作日志'); return; }
  const rows = data.entries;
  const multi = new Set(rows.map(e => e.user).filter(Boolean)).size > 1;  // 几个人共用项目时才显示是谁
  const BAD = { error: '出错', interrupted: '中断' };
  const today = dayOf(new Date()), yesterday = dayOf(new Date(Date.now() - 864e5));
  const parts = [el('button', { class: 'btn', type: 'button', onclick: clearAll }, '← 问题中心'),
    el('div', { class: 'ptitle' }, el('h2', {}, '操作日志'),
      el('p', { class: 'meta' }, '收图、识别、导出、人工决定和 AI 助手的提议，最新的在最上面。日志存在项目的 logs 文件夹里，跟着项目走。')),
    el('div', { class: 'opts' }, el('button', { class: 'btn', type: 'button', onclick: () => openFolder(data.folder) }, '打开日志文件夹'),
      el('button', { class: 'btn', type: 'button', onclick: renderLog }, '刷新'))];
  if (!rows.length) parts.push(el('p', { class: 'meta' }, '还没有操作记录。'));
  let day = null, list = null;
  for (const e of rows) {
    const t = new Date(e.time);
    const d = isNaN(t) ? '时间不详' : dayOf(t);
    if (d !== day) {
      day = d; list = el('div', {});
      parts.push(el('section', {}, el('h3', {}, d === today ? `今天 ${d}` : d === yesterday ? `昨天 ${d}` : d), list));
    }
    const who = [e.source || e.actor, multi && e.user ? e.user : null, e.seconds >= 1 ? `用时 ${secsText(e.seconds)}` : null].filter(Boolean).join(' · ');
    list.append(el('div', { class: 'logrow' },
      el('div', { class: 'head' }, el('span', { class: 'mono' }, isNaN(t) ? '--:--' : `${pad2(t.getHours())}:${pad2(t.getMinutes())}`),
        el('span', { class: 'what' }, e.title), BAD[e.status] ? el('span', { class: 'bad' }, BAD[e.status]) : null),
      e.summary ? el('small', {}, e.summary) : null,
      e.error ? el('small', { class: 'bad' }, e.error) : null,
      who ? el('small', {}, who) : null,
      e.lines && e.lines.length ? el('details', {}, el('summary', {}, `运行记录（${e.lines.length} 行）`),
        el('pre', { class: 'joblog' }, e.lines.join('\n'))) : null));
  }
  panel.replaceChildren(...parts);
}

  if (S || (APP && APP.project)) { try { await load(ui.asOf && S && ui.asOf !== Math.max(...S.batches.map(b => b.seq)) ? ui.asOf : null); } catch (e) { /* 忽略 */ } }
  if (ui.jobView) renderJob(j);
}
const durText = m => m < 90 ? `约 ${Math.round(m)} 分钟` : `约 ${(m / 60).toFixed(1)} 小时`;
const progText = (n, t) => t > 100000 ? `${(n / 1048576).toFixed(1)} / ${(t / 1048576).toFixed(1)} MB` : `${n} / ${t}`;
function paintJobBar(j) {  // 顶部常驻：任务在跑时，右栏去看别的也能看到进度
  const bar = document.getElementById('job-bar');
  if (!j || j.status !== 'running') { bar.hidden = true; return; }
  const p = j.progress && j.progress[1] ? j.progress : null;
  bar.replaceChildren(...[el('b', {}, j.title),
    el('span', { class: 'meta' }, [j.stage, p ? progText(p[0], p[1]) : '进行中…'].filter(Boolean).join(' ')),
    p ? el('div', { class: 'bar' }, el('i', { style: `width:${Math.round(p[0] / p[1] * 100)}%` })) : null,
    j.kind === 'recognize' && j.imported ? el('span', { class: 'meta' }, `已导入 ${j.imported} 页，左边跟着更新`) : null,
    ui.jobView ? null : el('button', { class: 'btn', type: 'button', onclick: showJob }, '查看进度')].filter(Boolean));
  bar.hidden = false;
}
function renderJob(j) {
  const parts = [el('button', { class: 'btn', type: 'button', onclick: () => { ui.jobView = false; clearAll(); paintJobBar(ui.job); } }, '← 问题中心'),
    el('div', { class: 'ptitle' }, el('h2', {}, j.title),
      el('p', { class: 'meta' }, j.status === 'running' ? `进行中…${j.stage ? '（' + j.stage + '）' : ''}` : j.status === 'done' ? `完成（${j.finished.slice(11)}）` : '没有完成'))];
  if (j.progress && j.progress[1]) {
    const [n, t] = j.progress;
    parts.push(el('div', {}, el('div', { class: 'bar' }, el('i', { style: `width:${Math.round(n / t * 100)}%` })),
      el('small', { class: 'meta' }, progText(n, t))));
  }
  if (j.kind === 'recognize' && j.imported && j.status === 'running') parts.push(el('p', { class: 'meta' },
    `已导入 ${j.imported} 页：左边的图谱和问题中心跟着更新，可以先点开已识别的图纸看。中途停下，已识别的也都在。`));
  if (j.error) parts.push(el('div', { class: 'note crit' }, j.error));
  const logBox = el('pre', { class: 'joblog', 'aria-label': '运行记录' }, j.lines.join('\n') || '…');
  // 估算完成后，运行记录和下面的分档列表重复：收起来，分档和“开始识别”直接排在标题下面
  parts.push(j.kind === 'estimate' && j.status === 'done' && j.result ? el('details', {}, el('summary', {}, '运行记录'), logBox) : logBox);
  const res = j.result;
  if (j.status === 'done' && j.kind === 'estimate') {
    if (!res) parts.push(el('div', { class: 'note' }, '没有需要识别的页面。'));
    else {
      const ex = res.executor || 'claude';
      const ready = ex === 'codex' ? !RECOG || RECOG.codex.ready : APP.claude_ready;
      const groups = res.priorities || [];
      const picked = new Set(groups.map(g => g.key));  // 默认全选，按从上到下的顺序识别
      const cost = gs => ex === 'codex' ? durText(gs.reduce((a, g) => a + g.minutes, 0))
        : gs.every(g => g.usd != null) ? `约 $${gs.reduce((a, g) => a + g.usd, 0).toFixed(2)}` : '';
      const go = el('button', { class: 'btn primary', type: 'button',
        onclick: () => startJob('recognize', { executor: ex, scope: res.scope, tier: res.tier, model: res.model, priorities: [...picked] }) });
      const sum = () => {
        const gs = groups.filter(g => picked.has(g.key)), n = gs.reduce((a, g) => a + g.pages, 0);
        go.textContent = n ? `开始识别 ${n} 页（${cost(gs)}）` : '请至少选一档';
        go.disabled = !ready || !n;
      };
      parts.push(section('识别顺序（从上到下）',
        el('p', { class: 'meta' }, '先识别对判断最有用的图：目录、说明、平面在前，详图大样放最后。可以只勾前几档，剩下的以后再识别。'),
        el('ul', { class: 'list prio' }, groups.map((g, i) => el('li', {},
          el('label', {}, el('input', { type: 'checkbox', checked: '', onchange: e => { if (e.target.checked) picked.add(g.key); else picked.delete(g.key); sum(); } }),
            el('span', {}, `${i + 1}. ${g.label} ${g.pages} 页 · ${cost([g])}`)),
          el('small', { class: 'meta' }, '例如：' + g.examples.join('、')))))));
      sum();
      parts.push(el('div', { class: 'opts' }, go,
        ready ? null : ex === 'codex' ? el('button', { class: 'btn', type: 'button', onclick: () => renderRecognize(true) }, '查看 Codex 状态')
          : el('button', { class: 'btn', type: 'button', onclick: renderSettings }, '先设置 API 密钥')));
    }
  }
  if (j.status === 'done' && j.kind === 'export' && res) parts.push(el('div', { class: 'opts' },
    el('button', { class: 'btn primary', type: 'button', onclick: () => openFolder(res.path) }, '打开文件夹'), el('span', { class: 'mono' }, res.path)));
  if (j.status === 'done' && j.kind === 'receive') parts.push(el('div', { class: 'opts' },
    el('button', { class: 'btn primary', type: 'button', onclick: renderRecognize }, '识别新页面'),
    el('button', { class: 'btn', type: 'button', onclick: () => { ui.jobView = false; clearAll(); } }, '查看问题中心')));
  if (j.kind === 'update' || j.kind === 'rollback') {
    if (j.status === 'done') parts.push(el('div', { class: 'note' }, '正在安装新版本，窗口会自动关闭，装好后自动重新打开。'));
  }
  panel.replaceChildren(...parts);
  ui.jobFirst = panel.firstChild;
  const log = panel.querySelector('.joblog');
  if (log) log.scrollTop = log.scrollHeight;
}

document.getElementById('tab-graph').addEventListener('click', () => setView('graph'));
document.getElementById('tab-facts').addEventListener('click', () => setView('facts'));
document.getElementById('clear').addEventListener('click', clearAll);
document.getElementById('g-mode-grid').addEventListener('click', () => setGraphMode('grid'));
document.getElementById('g-mode-net').addEventListener('click', () => setGraphMode('net'));
document.getElementById('g-color').addEventListener('change', e => {
  net.colorBy = e.target.value; net.pos = {}; net.nodes = [];  // 换着色方式，群落重新聚
  if (S && net.on) { netBuild(); net.userView = false; netKick(1); }
});
document.getElementById('g-search').addEventListener('input', e => {
  if (!S) return;
  const hits = searchSheets(e.target.value);
  ui.focusSet = e.target.value.trim() ? new Set(hits.map(s => s.no)) : null;
  paintGraph();
  if (hits.length && net.on) netCenter(hits[0].no);
  else if (hits.length && nodeEls[hits[0].no]) nodeEls[hits[0].no].scrollIntoView({ block: 'nearest', inline: 'nearest' });
});
document.getElementById('g-search').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !S) return;
  const hits = searchSheets(e.target.value);
  if (hits.length) { ui.focusSet = null; selectSheet(hits[0].no); }
});
document.getElementById('f-graph-issues').addEventListener('change', e => { ui.graphIssues = e.target.checked; paintGraph(); });
document.getElementById('f-facts-issues').addEventListener('change', e => { ui.factIssues = e.target.checked; renderMind(); });
document.getElementById('mm-expand').addEventListener('click', () => { ui.collapsed.clear(); renderMind(); });
document.getElementById('mm-collapse').addEventListener('click', () => { S.facts.groups.forEach(g => ui.collapsed.add(g.id)); renderMind(); });
document.getElementById('as-of').addEventListener('change', e => { const v = Number(e.target.value); ui.asOf = v; load(v === Math.max(...S.batches.map(b => b.seq)) ? null : v); });

setView((location.hash || '').replace('#', '') === 'facts' ? 'facts' : 'graph');
checkUpdate(false);
checkFresh();
try { if (localStorage.getItem('bidbench.graphMode') === 'net') setGraphMode('net'); } catch (e) { /* 忽略 */ }
let resizeTimer = null;
window.addEventListener('resize', () => {  // 窗口大小变了，图谱按新的宽度重新排
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (S && ui.view === 'graph' && net.on) netKick();
    else if (S && ui.view === 'graph' && Math.abs(graphWidth() - laidOutAt) > 40) buildGraph();
  }, 200);
});
boot().catch(() => { panel.replaceChildren(el('div', { class: 'note crit' }, '连接本地服务失败。请重新打开工作台。')); });
})();
</script>
