<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投标图纸工作台</title>
<style>
/* 布局：顶部信息条 + 主画布 + 右侧详情面板（窄屏时面板落到下方）。本地工具，不加载任何外部资源。 */
:root {
  --bg: #eef1f4; --surface: #ffffff; --band: #f5f7f9; --ink: #18212b; --muted: #5a6573;
  --line: #c9d1da; --edge: #8b97a5; --accent: #1d5fae; --accent-tint: #e3edf9;
  --ok: #2b7a4b; --warn: #a8690f; --warn-tint: #fbf0de; --crit: #bd3326; --crit-tint: #fbe5e2;
  --font-body: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", system-ui, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11161c; --surface: #19212a; --band: #151c24; --ink: #e3e9ef; --muted: #96a2af;
    --line: #314050; --edge: #6d7d8e; --accent: #6ea6ee; --accent-tint: #1c2f47;
    --ok: #5cbf86; --warn: #e2a64b; --warn-tint: #3a2e1a; --crit: #f0776a; --crit-tint: #3d2220;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55; }
[hidden] { display: none !important; }
.app { max-width: 1480px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.brand { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); }
h1 { margin: 0; font-size: 20px; }
.meta { margin: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag-sim { display: inline-block; padding: 0 8px; border-radius: 4px; background: var(--warn-tint); color: var(--warn); font-weight: 500; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.controls select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.tab { font: inherit; font-weight: 500; color: var(--muted); background: none; border: 0; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--surface); }
button:focus-visible, select:focus-visible, input:focus-visible, .node:focus-visible, .mm:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.node:focus:not(:focus-visible), .mm:focus:not(:focus-visible) { outline: none; }
.work { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .work { grid-template-columns: minmax(0, 1fr); } }
.view { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; display: flex; flex-direction: column; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
.toolbar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.spacer { flex: 1; }
.btn { font: inherit; font-size: 13px; color: var(--ink); background: var(--band); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--edge); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 18px; height: 11px; border-radius: 3px; border: 1.5px solid var(--line); background: var(--surface); }
.sw.s-updated, .sw.s-new { border: 2px solid var(--accent); }
.sw.s-changed, .sw.s-pending_void { border: 2px solid var(--warn); }
.sw.s-conflict { border: 2px solid var(--crit); }
.sw.s-missing { border: 1.5px dashed var(--muted); background: none; }
.ln { width: 22px; height: 0; border-top: 1.5px solid var(--edge); }
.ln.cross { border-top-style: dashed; }
.ln.catalog { border-top-style: dotted; border-top-width: 2px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.c-confirmed { background: var(--ink); } .c-high { background: var(--ok); } .c-mid { background: var(--accent); }
.c-low { background: var(--warn); } .c-conflict { background: var(--crit); }
.canvas { overflow: auto; padding: 8px; }
.canvas svg { display: block; }
.hint { margin: 0; padding: 8px 14px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }
.band { fill: var(--band); stroke: var(--line); }
.band-label { fill: var(--muted); font-size: 12px; letter-spacing: .08em; }
.edge { stroke: var(--edge); stroke-width: 1.25; fill: none; }
.edge.cross { stroke-dasharray: 6 4; }
.edge.catalog { stroke-dasharray: 2 4; stroke-width: 1.6; }
.edge.dangling { stroke: var(--crit); }
.edge.dim { opacity: .12; }
.edge.on { stroke: var(--accent); stroke-width: 2; }
.arrow { fill: var(--edge); } .arrow-crit { fill: var(--crit); } .arrow-on { fill: var(--accent); }
.node { cursor: pointer; }
.node .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.25; }
.node.st-updated .box, .node.st-new .box { stroke: var(--accent); stroke-width: 2; }
.node.st-changed .box, .node.st-pending_void .box { stroke: var(--warn); stroke-width: 2; }
.node.st-conflict .box { stroke: var(--crit); stroke-width: 2; }
.node.st-missing .box, .node.st-voided .box { fill: var(--band); stroke: var(--muted); stroke-dasharray: 5 4; }
.node .num { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; fill: var(--ink); }
.node .ttl { font-size: 12px; fill: var(--muted); }
.node.st-missing .num, .node.st-voided .num, .node.st-missing .ttl, .node.st-voided .ttl { fill: var(--muted); }
.node .tag { font-size: 11px; font-weight: 500; }
.t-updated, .t-new { fill: var(--accent); } .t-changed, .t-pending_void { fill: var(--warn); }
.t-conflict, .t-missing { fill: var(--crit); } .t-voided, .t-inner { fill: var(--muted); }
.node .ring { fill: none; stroke: var(--accent); stroke-width: 2.5; opacity: 0; }
.node.sel .ring { opacity: 1; }
.node.hl .box { fill: var(--accent-tint); }
.node.dim { opacity: .28; }
.mm { cursor: pointer; }
.mm-link { fill: none; stroke: var(--line); stroke-width: 1.5; }
.mm .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.25; }
.mm-root .box { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 2; }
.mm-root text { font-weight: 700; fill: var(--ink); font-size: 14px; }
.mm-group text.lbl { font-weight: 600; fill: var(--ink); font-size: 13px; }
.mm-group text.cnt { fill: var(--muted); font-size: 12px; font-family: var(--font-mono); }
.mm-fact text { fill: var(--ink); font-size: 13px; }
.mm-fact.conf-conflict .box { stroke: var(--crit); }
.mm-fact.hl .box { fill: var(--accent-tint); stroke: var(--accent); }
.mm-fact.sel .box { stroke: var(--accent); stroke-width: 2.5; }
.mm-fact.dim { opacity: .35; }
.cd-confirmed { fill: var(--ink); } .cd-high { fill: var(--ok); } .cd-mid { fill: var(--accent); } .cd-low { fill: var(--warn); } .cd-conflict { fill: var(--crit); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel h2 { margin: 0; font-size: 16px; }
.panel h3 { margin: 0 0 6px; font-size: 12px; font-weight: 500; letter-spacing: .08em; color: var(--muted); }
.panel p { margin: 0; }
.ptitle { display: flex; flex-direction: column; gap: 4px; }
.pnum { font-family: var(--font-mono); font-size: 22px; font-weight: 600; line-height: 1.2; }
.pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill.st-updated, .pill.st-new, .pill.conf-mid { color: var(--accent); border-color: var(--accent); }
.pill.st-changed, .pill.st-pending_void, .pill.conf-low { color: var(--warn); border-color: var(--warn); }
.pill.st-conflict, .pill.st-missing, .pill.conf-conflict { color: var(--crit); border-color: var(--crit); }
.pill.conf-high { color: var(--ok); border-color: var(--ok); }
.pill.conf-confirmed { color: var(--ink); border-color: var(--ink); }
dl.kv { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
.note { padding: 8px 10px; border-radius: 6px; font-size: 13px; background: var(--band); border-left: 3px solid var(--edge); }
.note.warn { background: var(--warn-tint); border-left-color: var(--warn); }
.note.crit { background: var(--crit-tint); border-left-color: var(--crit); }
ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
ul.list li { min-width: 0; overflow-wrap: anywhere; }
.issue { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; background: var(--band); }
.issue .head { display: flex; gap: 8px; align-items: flex-start; }
.issue .head .dot { margin-top: 6px; }
.issue .go { font: inherit; text-align: left; background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; font-weight: 500; }
.issue .go:hover { color: var(--accent); }
.issue small { color: var(--muted); display: block; font-size: 12px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.linkbtn { font: inherit; text-align: left; width: 100%; display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--band); color: var(--ink); cursor: pointer; }
.linkbtn:hover { border-color: var(--accent); }
.linkbtn .dot { margin-top: 6px; }
.linkbtn small { color: var(--muted); display: block; }
.chip { font: inherit; font-family: var(--font-mono); font-size: 12px; padding: 1px 8px; border-radius: 4px; border: 1px solid var(--accent); color: var(--accent); background: none; cursor: pointer; }
.ev { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
.ev.stale { opacity: .6; }
.ev .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 12px; color: var(--muted); }
.ev q { font-size: 13px; color: var(--ink); quotes: "「" "」"; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; }
.stat b { font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.3; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.crit b { color: var(--crit); } .stat.warn b { color: var(--warn); }
.versions li { display: grid; grid-template-columns: 34px 92px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-variant-numeric: tabular-nums; }
.versions li.old { color: var(--muted); }
.form { display: flex; gap: 6px; }
.form input { font: inherit; flex: 1; min-width: 0; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.update-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 12px; border-radius: 8px;
  background: var(--accent-tint); border: 1px solid var(--accent); font-size: 13px; }
.update-bar b { color: var(--accent); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 8px 16px; border-radius: 6px; font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">投标图纸工作台</span>
      <h1 id="proj-name">加载中…</h1>
      <p class="meta" id="proj-meta"></p>
    </div>
    <div class="controls">
      <label class="meta" for="as-of">查看截至</label>
      <select id="as-of"></select>
      <nav class="tabs" role="tablist" aria-label="显示模式">
        <button class="tab" role="tab" id="tab-graph" aria-controls="view-graph" aria-selected="true">图纸知识图谱</button>
        <button class="tab" role="tab" id="tab-facts" aria-controls="view-facts" aria-selected="false">事实思维导图</button>
      </nav>
    </div>
  </header>
  <div class="update-bar" id="update-bar" hidden></div>
  <div class="work">
    <div>
      <section class="view" id="view-graph" role="tabpanel" aria-labelledby="tab-graph">
        <div class="toolbar">
          <label for="f-graph-issues"><input type="checkbox" id="f-graph-issues"> 只看有问题的图纸</label>
          <div class="legend">
            <span><i class="sw"></i>现行</span><span><i class="sw s-updated"></i>本批升版/新增</span>
            <span><i class="sw s-changed"></i>有变更/待确认</span><span><i class="sw s-conflict"></i>冲突</span>
            <span><i class="sw s-missing"></i>缺失/作废</span><span><i class="ln"></i>索引引用</span>
            <span><i class="ln cross"></i>跨专业</span><span><i class="ln catalog"></i>目录列出</span>
          </div>
          <span class="spacer"></span>
          <button class="btn" id="clear" type="button">清除选择</button>
        </div>
        <div class="canvas"><svg id="graph" role="group" aria-label="图纸知识图谱"></svg></div>
        <p class="hint">点击图纸查看详情；选中后只突出它的直接关联。红色连线指向缺失的图纸。</p>
      </section>
      <section class="view" id="view-facts" role="tabpanel" aria-labelledby="tab-facts" hidden>
        <div class="toolbar">
          <label for="f-facts-issues"><input type="checkbox" id="f-facts-issues"> 只看冲突和低置信度</label>
          <div class="legend">
            <span><i class="dot c-confirmed"></i>人工确认</span><span><i class="dot c-high"></i>高置信</span>
            <span><i class="dot c-mid"></i>中置信</span><span><i class="dot c-low"></i>低置信</span><span><i class="dot c-conflict"></i>冲突</span>
          </div>
          <span class="spacer"></span>
          <button class="btn" id="mm-expand" type="button">全部展开</button>
          <button class="btn" id="mm-collapse" type="button">全部收起</button>
        </div>
        <div class="canvas"><svg id="mind" role="group" aria-label="事实思维导图"></svg></div>
        <p class="hint">点击分组展开或收起；点击事实查看证据，证据里的图号可跳回图谱。</p>
      </section>
    </div>
    <aside class="panel" id="panel" aria-live="polite"><p class="meta">加载中…</p></aside>
  </div>
</div>
<script>
(() => {
const NS = 'http://www.w3.org/2000/svg';
const NW = 136, NH = 48;
const STATUS = { current: '现行', new: '本批新增', updated: '本批升版', changed: '有变更单', conflict: '冲突',
  pending_void: '作废还是漏发', voided: '已作废', missing: '缺失' };
const CONF = { confirmed: '人工确认', high: '高置信', mid: '中置信', low: '低置信', conflict: '冲突' };
const DISC_ORDER = ['建筑', '结构', '给排水', '暖通', '电气', '其他'];

let S = null;
const ui = { view: 'graph', selD: null, selF: null, focusSet: null, backTo: null, collapsed: new Set(),
  graphIssues: false, factIssues: false, asOf: null };
let nodeEls = {}, edgeEls = [], sheetBy = {}, factBy = {}, factGroupOf = {};

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null) n.append(c instanceof Node ? c : document.createTextNode(c)); });
  return n;
}
function sv(tag, attrs, ...kids) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  kids.flat().forEach(c => n.append(c instanceof Node ? c : document.createTextNode(c)));
  return n;
}
const ctx = document.createElement('canvas').getContext('2d');
function textW(s, size, weight) {
  ctx.font = `${weight || 400} ${size}px ${getComputedStyle(document.body).fontFamily}`;
  return ctx.measureText(s).width;
}
function toast(msg) {
  const t = el('div', { class: 'toast', role: 'status' }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 2200);
}

async function load(asOf) {
  const r = await fetch('/api/state' + (asOf ? `?as_of=${asOf}` : ''));
  setState(await r.json());
}
async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) { toast(data.error || '操作失败'); return false; }
  setState(data);
  return true;
}
async function actProposal(id, action) {
  const r = await fetch('/api/proposal', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, action }) });
  const data = await r.json();
  if (!r.ok) { toast(data.error || '操作失败'); return; }
  setState(data);
  toast(data.last_outcome || (action === 'confirm' ? '已确认' : '已驳回'));
}
function proposalSummary(p) {
  const d = p.payload;
  if (p.kind === 'decision') return `${d.issue_title} → ${d.label}`;
  if (p.kind === 'baseline') return `锁定基线「${d.name}」（${d.sheets ? d.sheets.join('、') : '全部现行图纸'}）`;
  if (p.kind === 'note') return `项目笔记「${d.topic}」：${d.text}`;
  return p.kind;
}
async function decide(opt) {
  if (await post('/api/decision', { kind: opt.kind, key: opt.key, value: opt.value })) toast('已记录：' + opt.label);
}

function setState(st) {
  S = st;
  sheetBy = Object.fromEntries(S.sheets.map(s => [s.no, s]));
  factBy = {}; factGroupOf = {};
  S.facts.groups.forEach(g => g.facts.forEach(f => { factBy[f.key] = f; factGroupOf[f.key] = g.label; }));
  if (ui.selD && !sheetBy[ui.selD]) ui.selD = null;
  if (ui.selF && !factBy[ui.selF]) ui.selF = null;
  renderHeader();
  buildGraph();
  renderMind();
  if (ui.selD) renderSheet(ui.selD); else if (ui.selF) renderFact(ui.selF); else renderOverview();
}

function renderHeader() {
  document.getElementById('proj-name').textContent = S.project.name;
  const b = S.batches.find(x => x.seq === S.as_of);
  const rec = S.recognition;
  const ex = Object.entries(rec.executors).map(([k, v]) => `${k === 'simulated' ? '模拟执行器' : k} ${v} 页`).join('、') || '尚未识别';
  const meta = document.getElementById('proj-meta');
  meta.replaceChildren(`${S.batches.length} 个收图批次 · ${S.sheets.length} 个图号 · `,
    b ? `截至 ${b.received_at} · ` : '', `已识别 ${rec.recognized}/${rec.pages} 页（${ex}）`,
    rec.executors.simulated ? el('span', {}, ' · ', el('span', { class: 'tag-sim' }, '识别结果为模拟数据')) : '',
    VER ? el('span', {}, ' · ', el('button', { class: 'chip', type: 'button', onclick: renderUpdate, title: '软件更新' },
      `v${VER.version}${VER.commit ? ' ' + VER.commit : ''}`)) : '');
  const sel = document.getElementById('as-of');
  sel.replaceChildren(...S.batches.map(x => el('option', { value: x.seq }, `批次 #${x.seq}（${x.received_at}）`)));
  sel.value = S.as_of;
}

/* ---------- 图谱 ---------- */
const gsvg = document.getElementById('graph');
function layout() {
  const groups = {};
  S.sheets.forEach(s => (groups[s.discipline] ||= []).push(s));
  const discs = Object.keys(groups).sort((a, b) => DISC_ORDER.indexOf(a) - DISC_ORDER.indexOf(b));
  const MAXW = 1040, GAPX = 20, GAPY = 24, PAD = 12, COLW = NW + 20, ROWH = NH + 28;
  let x = 12, y = 20, rowH = 0, maxX = 0;
  const bands = [], pos = {};
  discs.forEach(d => {
    const items = groups[d];
    const cols = Math.min(4, Math.max(1, Math.ceil(Math.sqrt(items.length))));
    const rows = Math.ceil(items.length / cols);
    const bw = cols * COLW - 20 + PAD * 2, bh = rows * ROWH + 40;
    if (x + bw > MAXW && x > 12) { x = 12; y += rowH + GAPY; rowH = 0; }

      e.from === no ? e.label : `被引用：${e.label}`);
  }))));
  const fs = S.facts.groups.flatMap(g => g.facts).filter(f => f.sources.includes(no));
  parts.push(section(`来自此图的事实（${fs.length}）`, fs.length ? el('ul', { class: 'list' }, fs.map(f => el('li', {},
    el('button', { class: 'linkbtn', type: 'button', onclick: () => jumpFact(f.key) }, el('i', { class: `dot c-${f.conf}` }),
      el('span', {}, `${f.name}：${f.value}`, el('small', {}, CONF[f.conf]))))))
    : el('p', { class: 'meta' }, s.status === 'missing' ? '缺失图纸没有可抽取的内容。' : '暂未从此图抽取事实。')));
  panel.replaceChildren(...parts);
}

function renderFact(key) {
  const f = factBy[key];
  const parts = [el('button', { class: 'btn', type: 'button', onclick: clearAll }, '← 问题中心'),
    el('div', { class: 'ptitle' }, el('span', { class: 'meta' }, factGroupOf[key]), el('h2', {}, `${f.name}：${f.value}`),
      el('span', { class: `pill conf-${f.conf}` }, CONF[f.conf]))];
  if (f.note) parts.push(el('div', { class: `note ${f.conf === 'conflict' ? 'crit' : f.note.includes('升版') ? 'warn' : ''}` }, f.note));
  const iss = issueFor({ fact: key });
  iss.forEach(i => { const o = optionButtons(i); if (o) parts.push(o); });
  if (!iss.length && f.conf !== 'confirmed' && latest())
    parts.push(el('div', { class: 'opts' }, el('button', { class: 'btn', type: 'button', onclick: () => decide({ kind: 'fact', key, value: f.value, label: `确认 ${f.name} = ${f.value}` }) }, '人工确认此值')));
  parts.push(section(`证据（${f.evidence.length}）`, el('div', { style: 'display:flex;flex-direction:column;gap:8px' }, f.evidence.map(e =>
    el('div', { class: `ev${e.active ? '' : ' stale'}` },
      el('div', { class: 'row' }, el('button', { class: 'chip', type: 'button', onclick: () => showSources(key, e.sheet) }, `${e.sheet} ${e.rev || ''}版`),
        el('span', {}, e.source === 'text_layer' ? '文字层' : e.source === 'vision' ? '看图识别' : '文字层+看图'),
        e.active ? null : el('span', {}, '已被新版替代'),
        el('a', { href: `/api/page/${e.page_id}.pdf`, target: '_blank', rel: 'noopener' }, '原图')),
      el('q', {}, e.text || e.value))))));
  parts.push(el('button', { class: 'btn', type: 'button', onclick: () => showSources(key, f.sources[0]) }, `在图谱中高亮全部 ${f.sources.length} 张出处图纸`));
  panel.replaceChildren(...parts);
}

/* ---------- 更新 ---------- */
let UPD = null, VER = null;
async function checkUpdate(force) {
  try {
    VER = await (await fetch('/api/version')).json();
    if (S) renderHeader();  // 项目数据还没加载完时，等 setState 时再画页头
    UPD = await (await fetch('/api/update/check' + (force ? '?force=1' : ''))).json();
  } catch (e) { return; }
  const bar = document.getElementById('update-bar');
  if (UPD.status === 'available') {
    bar.replaceChildren(el('b', {}, '有新版本'), `${UPD.commits.length} 项更新`,
      el('button', { class: 'btn primary', type: 'button', onclick: renderUpdate }, '查看并更新'));
    bar.hidden = false;
  } else bar.hidden = true;
}
function renderUpdate() {
  const u = UPD || {};
  const parts = [el('button', { class: 'btn', type: 'button', onclick: clearAll }, '← 问题中心'),
    el('div', { class: 'ptitle' }, el('h2', {}, '软件更新'),
      el('p', { class: 'meta' }, `当前 ${VER ? VER.version + '（' + (VER.commit || '未知') + '）' : ''}`))];
  if (u.status === 'available') {
    parts.push(section(`本次更新（${u.commits.length}）`, el('ul', { class: 'list' }, u.commits.map(c =>
      el('li', {}, el('span', { class: 'mono' }, c.date), ' ', c.title)))));
    if (u.deps_changed) parts.push(el('div', { class: 'note warn' }, '这次更新改动了依赖，重启前会自动补装，可能多花一两分钟。'));
    parts.push(el('div', { class: 'note' }, '更新只替换程序代码，不会动你的项目数据；更新后可以回退到上一版。'));
    parts.push(el('div', { class: 'opts' }, el('button', { class: 'btn primary', type: 'button', onclick: () => runUpdate('apply') }, '更新并重启')));
  } else {
    parts.push(el('div', { class: `note ${u.status === 'up_to_date' ? '' : 'warn'}` }, u.message || '无法检查更新。'));
    parts.push(el('div', { class: 'opts' }, el('button', { class: 'btn', type: 'button', onclick: async () => { await checkUpdate(true); renderUpdate(); } }, '重新检查')));
  }
  if (VER && VER.can_rollback) parts.push(section('回退', el('p', { class: 'meta' }, `上次更新于 ${VER.last_update.replace('T', ' ')}。新版本有问题时可以回到更新前的版本。`),
    el('div', { class: 'opts', style: 'margin-top:6px' }, el('button', { class: 'btn', type: 'button', onclick: () => runUpdate('rollback') }, '回退到上一版'))));
  panel.replaceChildren(...parts);
}
async function runUpdate(action) {
  panel.replaceChildren(el('div', { class: 'ptitle' }, el('h2', {}, action === 'apply' ? '正在更新' : '正在回退'),
    el('p', { class: 'meta' }, '正在拉取代码并重启工作台，完成后页面会自动刷新。请不要关闭命令行窗口。')));
  const r = await fetch(`/api/update/${action}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  const data = await r.json();
  if (!r.ok) { toast(data.error || '更新失败'); renderUpdate(); return; }
  const before = VER && VER.commit;
  const started = Date.now();
  const poll = async () => {
    try {
      const v = await (await fetch('/api/version', { cache: 'no-store' })).json();
      if (v.commit && v.commit !== before) { location.reload(); return; }
    } catch (e) { /* 重启中，继续等 */ }
    if (Date.now() - started > 120000) {
      panel.replaceChildren(el('div', { class: 'note warn' }, '重启时间比预期长。请稍后手动刷新页面；如果打不开，在命令行重新运行 bidbench serve。'));
      return;
    }
    setTimeout(poll, 1500);
  };
  setTimeout(poll, 2000);
}

/* ---------- 动作 ---------- */
function setView(v) {
  ui.view = v;
  document.getElementById('view-graph').hidden = v !== 'graph';
  document.getElementById('view-facts').hidden = v !== 'facts';
  document.getElementById('tab-graph').setAttribute('aria-selected', String(v === 'graph'));
  document.getElementById('tab-facts').setAttribute('aria-selected', String(v === 'facts'));
  try { history.replaceState(null, '', '#' + v); } catch (e) { /* 忽略 */ }
  if (!S) return;
  if (v === 'facts') renderMind(); else paintGraph();
}
function selectSheet(no) { ui.selD = no; ui.selF = null; paintGraph(); renderMind(); renderSheet(no); }
function selectFact(key) { ui.selF = key; ui.selD = null; ui.focusSet = null; ui.backTo = null; renderMind(); paintGraph(); renderFact(key); }
function jumpSheet(no) { ui.focusSet = null; ui.backTo = null; setView('graph'); selectSheet(no); }
function jumpFact(key) {
  ui.collapsed.delete(factGroupOf[key]);
  if (ui.factIssues && !factMatch(factBy[key])) { ui.factIssues = false; document.getElementById('f-facts-issues').checked = false; }
  ui.selD = null; setView('facts'); selectFact(key);
}
function showSources(key, no) {
  ui.focusSet = new Set(factBy[key].sources); ui.backTo = key;
  setView('graph'); ui.selD = no; ui.selF = key; paintGraph(); renderSheet(no);
}
function clearAll() { ui.selD = null; ui.selF = null; ui.focusSet = null; ui.backTo = null; paintGraph(); renderMind(); renderOverview(); }

document.getElementById('tab-graph').addEventListener('click', () => setView('graph'));
document.getElementById('tab-facts').addEventListener('click', () => setView('facts'));
document.getElementById('clear').addEventListener('click', clearAll);
document.getElementById('f-graph-issues').addEventListener('change', e => { ui.graphIssues = e.target.checked; paintGraph(); });
document.getElementById('f-facts-issues').addEventListener('change', e => { ui.factIssues = e.target.checked; renderMind(); });
document.getElementById('mm-expand').addEventListener('click', () => { ui.collapsed.clear(); renderMind(); });
document.getElementById('mm-collapse').addEventListener('click', () => { S.facts.groups.forEach(g => ui.collapsed.add(g.id)); renderMind(); });
document.getElementById('as-of').addEventListener('change', e => { const v = Number(e.target.value); ui.asOf = v; load(v === Math.max(...S.batches.map(b => b.seq)) ? null : v); });

setView((location.hash || '').replace('#', '') === 'facts' ? 'facts' : 'graph');
checkUpdate(false);
load(null).catch(() => { panel.replaceChildren(el('div', { class: 'note crit' }, '连接本地服务失败。请确认 bidbench serve 正在运行。')); });
})();
</script>
